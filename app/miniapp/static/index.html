<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f0b18">
  <title>Королевство Флоптропика</title>
  <script src="https://telegram.org/js/telegram-web-app.js?62"></script>
  <link rel="stylesheet" href="/miniapp/static/styles.css">
</head>
<body>
  <div class="world-bg" aria-hidden="true">
    <div class="aurora aurora-one"></div>
    <div class="aurora aurora-two"></div>
    <div id="particles" class="particles"></div>
    <div class="fog fog-one"></div>
    <div class="fog fog-two"></div>
  </div>

  <div id="loading" class="loading-screen">
    <div class="portal">
      <div class="portal-ring ring-one"></div>
      <div class="portal-ring ring-two"></div>
      <div class="portal-core"><img id="loadingLogo" class="loading-logo hidden" alt=""><span id="loadingEmoji">👑</span></div>
    </div>
    <h1>Королевство Флоптропика</h1>
    <p>Магические врата открываются…</p>
  </div>

  <div id="app" class="app-shell hidden">
    <header id="topbar" class="topbar glass">
      <div class="brand-block">
        <div class="brand-kicker">КОРОЛЕВСТВО ФЛОПТРОПИКА</div>
        <h1 id="heroName">Герой</h1>
      </div>
      <div class="wallet rune-border">
        <span class="wallet-icon">🪙</span>
        <b id="gold">0</b>
      </div>
    </header>

    <main id="content" class="content"></main>

    <nav id="bottomNav" class="bottom-nav glass">
      <button data-view="home" class="active">
        <span class="nav-icon">🏛</span><span>Главная</span>
      </button>
      <button data-view="hero">
        <span class="nav-icon">👤</span><span>Герой</span>
      </button>
      <button data-view="house">
        <span class="nav-icon">🏰</span><span>Дом</span>
      </button>
      <button data-view="treasury">
        <span class="nav-icon">💰</span><span>Казна</span>
      </button>
      <button data-view="more">
        <span class="nav-icon">✨</span><span>Ещё</span>
      </button>
    </nav>
  </div>



  <div id="imageViewer" class="image-viewer hidden" role="dialog" aria-modal="true">
    <button class="viewer-close" onclick="closeImageViewer()" aria-label="Закрыть">✕</button>
    <img id="viewerImage" alt="">
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/miniapp/static/app.js"></script>
</body>
</html>
